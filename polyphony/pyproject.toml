[project]
name = "polyphony"
version = "0.0.1"
description = "A paradigm-plural, adversarially-validated policy simulation ensemble built on the Atlas of Computational Policy Simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Polyphony contributors" }]
keywords = ["policy", "simulation", "ensemble", "integrated-assessment", "validation"]

# numpy is a hard runtime dependency: the core loaders, engines, eval metrics, and every
# experiment import it. (It was omitted while the Phase-0/1 scaffold was numpy-free; the
# package has since grown to depend on it, so it must be declared or a clean install — e.g.
# CI — fails at import with ModuleNotFoundError even though a dev box has numpy globally.)
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["polyphony*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the enforced rule set explicitly so the gate is deterministic across ruff versions.
# ruff's historical default (pyflakes F + pycodestyle E4/E7/E9) — the rules this project has
# always been held to. Newer ruff releases (0.16+) turn on extra style/modernization families
# (RUF/UP/I/BLE) by default; opt into those deliberately rather than via silent tool drift.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
